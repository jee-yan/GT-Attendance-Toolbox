# 应用设置
app:
  title: "国投实名制同步 - CR24024"

# 考勤设备列表
devices:
  - id: "CR24024_device_1"
    name: "CR24024 考勤机"
    ip: "192.168.110.21"
    port: 80
    username: "admin"
    password: "Xhdn1599abc"

# 后端服务配置
server:
  # base_url: "http://192.168.110.18:8000"
  base_url: "http://49.91.31.134:8000"
  upload_personnel_url: "/api/personnel/sync"
  # 考勤推送配置（设备直接推送考勤事件到服务器）
  push_server_url: "/api/attendance/push"
  
# 同步设置
sync:
  personnel_cron: "0 0 8 * * *"
  attendance_cron: "0 */30 * * * *"

# 按钮配置
buttons:
  - id: "sync_personnel"
    label: "同步人员"
    action:
      type: script
      script: |
        return await window.syncPersonnel();

  - id: "configure_push"
    label: "配置推送"
    action:
      type: script
      script: |
        return await window.configurePush();

# 定时任务配置
schedules:
  - id: "auto_sync_personnel"
    name: "自动同步人员"
    cron: "0 0 8 * * *"
    action:
      type: script
      script: |
        return await window.syncPersonnel();
